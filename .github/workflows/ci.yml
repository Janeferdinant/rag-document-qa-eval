name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -e .
      # Lint, types and fast tests only. No dataset or model downloads, no browser, no long runs.
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q
